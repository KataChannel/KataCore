  #     - NEXTAUTH_SECRET=your-nextauth-secret-change-this-in-production
  #     - NEXTAUTH_URL=http://localhost:3000
  #   depends_on:
  #     - postgres-db
  #     - minio
  #   volumes:
  #     - .:/app
  #     - /app/node_modules
  #   command: npm run dev
  #   networks:
  #     - websiteseo-network     

volumes:
  postgres_data:
  pgadmin_data:
  minio_data:

networks:
  websiteseo-network:
    driver: bridge
