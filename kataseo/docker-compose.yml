version: '3.8'

services:
  # PostgreSQL Database
  postgres-db:
    image: postgres:15-alpine
    container_name: websiteseo-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=websiteseo
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    networks:
      - websiteseo-network

  # PgAdmin
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: websiteseo-pgadmin
    ports:
      - "5050:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@websiteseo.com
      - PGADMIN_DEFAULT_PASSWORD=admin123
      - PGADMIN_CONFIG_SERVER_MODE=False
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres-db
    networks:
      - websiteseo-network

  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    container_name: websiteseo-minio
    ports:
      - "9000:9000"  # API
      - "9001:9001"  # Console
    environment:
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin123
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin123
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - websiteseo-network

  # MinIO Client (for bucket creation)
  minio-client:
    image: minio/mc:latest
    container_name: websiteseo-minio-client
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 10;
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin123;
      /usr/bin/mc mb myminio/websiteseo-media --ignore-existing;
      /usr/bin/mc policy set public myminio/websiteseo-media;
      exit 0;
      "
    networks:
      - websiteseo-network
  # Next.js Application
  # nextjs-app:
  #   build:
  #     context: .
  #     dockerfile: docker/Dockerfile
  #   container_name: websiteseo-app
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     - NODE_ENV=development
  #     - DB_URL=postgresql://postgres:password@postgres-db:5432/websiteseo?schema=public
  #     - DATABASE_URL=postgresql://postgres:password@postgres-db:5432/websiteseo?schema=public
  #     - MINIO_ACCESS_KEY=minioadmin
  #     - MINIO_SECRET_KEY=minioadmin123
  #     - MINIO_ENDPOINT=minio
  #     - MINIO_PORT=9000
