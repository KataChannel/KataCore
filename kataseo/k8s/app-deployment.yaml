apiVersion: v1
kind: Namespace
metadata:
  name: seo-cms
  labels:
    name: seo-cms
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: seo-cms-config
  namespace: seo-cms
data:
  NODE_ENV: "production"
  MINIO_ENDPOINT: "minio-service"
  MINIO_PORT: "9000"
  REDIS_URL: "redis://redis-service:6379"
---
apiVersion: v1
kind: Secret
metadata:
  name: seo-cms-secrets
  namespace: seo-cms
type: Opaque
stringData:
  DATABASE_URL: "postgresql://postgres:password@postgres-service:5432/seo_cms"
  JWT_SECRET: "your-super-secret-jwt-key"
  NEXTAUTH_SECRET: "your-nextauth-secret"
  MINIO_ACCESS_KEY: "minioadmin"
  MINIO_SECRET_KEY: "minioadmin123"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seo-cms-app
  namespace: seo-cms
  labels:
    app: seo-cms-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: seo-cms-app
  template:
    metadata:
      labels:
        app: seo-cms-app
    spec:
      containers:
      - name: seo-cms
        image: ghcr.io/katachannel/kataseo:latest
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: seo-cms-config
              key: NODE_ENV
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: seo-cms-secrets
              key: DATABASE_URL
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: seo-cms-secrets
              key: JWT_SECRET
        - name: NEXTAUTH_SECRET
          valueFrom:
            secretKeyRef:
              name: seo-cms-secrets
              key: NEXTAUTH_SECRET
        - name: MINIO_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: seo-cms-config
              key: MINIO_ENDPOINT
        - name: MINIO_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: seo-cms-secrets
              key: MINIO_ACCESS_KEY
        - name: MINIO_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: seo-cms-secrets
              key: MINIO_SECRET_KEY
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: seo-cms-service
  namespace: seo-cms
spec:
  selector:
    app: seo-cms-app
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: seo-cms-ingress
  namespace: seo-cms
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rate-limit: "100"
spec:
  tls:
  - hosts:
    - yourdomain.com
    secretName: seo-cms-tls
  rules:
  - host: yourdomain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: seo-cms-service
            port:
              number: 80
